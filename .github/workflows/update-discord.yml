name: Mise à jour du site Legodingo13

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

  push:
    branches:
      - main
    paths:
      - "tableau.png"
      - "update.py"
      - "fond.png"
      - "logo.png"
      - "Youtube.png"
      - "foe_logo.png"
      - "guns.png"
      - "profil_tableau.png"
      - "roi_chute.png"
      - "forgedb.png"
      - "foe_scoredb.png"
      - "foe_data.png"
      - "banana_db.png"
      - "foe_tools.png"
      - "foe_hammer.png"
      - "foe_helper.png"
      - "ubernerd14.png"
      - "cursor_default.cur"
      - "cursor_hover.cur"
      - ".github/workflows/update-discord.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Récupérer les fichiers
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Générer toutes les pages du site
        run: python update.py

      - name: Enregistrer les nouvelles statistiques
        shell: bash
        run: |
          set -e

          git config user.name "site-legodingo13-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last-update.txt

          if git diff --cached --quiet; then
            echo "Aucune nouvelle statistique à enregistrer."
            exit 0
          fi

          git commit -m "Mise à jour automatique des statistiques"

          # Le PC peut envoyer tableau.png pendant que GitHub Actions travaille.
          # On récupère donc les éventuels nouveaux commits avant le push.
          for tentative in 1 2 3 4 5
          do
            echo "Tentative de synchronisation Git n°${tentative}..."

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main
            then
              echo "Statistiques enregistrées sur GitHub."
              exit 0
            fi

            echo "Le dépôt a encore changé. Nouvelle tentative dans 2 secondes..."
            sleep 2
          done

          echo "Impossible d'envoyer les statistiques après 5 tentatives."
          exit 1

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Préparer le site
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"


  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v5
